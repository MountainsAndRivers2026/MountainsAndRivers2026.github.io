{{- $src := .Destination -}}
{{- $resource := .Page.Resources.GetMatch $src -}}

{{- if $resource -}}
  <!-- FOUND RESOURCE: {{ $src }} -->
  <img src="{{ $resource.RelPermalink }}" alt="{{ .Text }}">
{{- else -}}
  <!-- RESOURCE NOT FOUND: {{ $src }} -->
  <img src="{{ $src | safeURL }}" alt="{{ .Text }}">
{{- end -}}
